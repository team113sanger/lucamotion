# Synergy dual-guide template (LUCA paired-end)
sequencing_type: paired_end

libraries:
  - id: synergy_pos_1_guides.tsv
    reverse_on: never
  - id: synergy_pos_2_guides.tsv
    reverse_on: reverse_group

read_group_templates:
  read_1:
    - forward
  read_2:
    - reverse

read_templates:
  - id: forward
    anchor: left
    regions:
      - id: guide
        libraries: [synergy_pos_1_guides.tsv]
        skip: 0
        max_offset: 4
  - id: reverse
    anchor: left
    regions:
      - id: guide
        libraries: [synergy_pos_2_guides.tsv]
        skip: 0
        max_offset: 4

combinations:
  - id: synergy_dual_guide
    regions:
      - id: guide
        read_group: read_1
        filter: true
      - id: guide
        read_group: read_2
        filter: true
    filters:
      - synergy_pair_filter.tsv

default_options:
  test_swaps: false
  full_match_info: false
  out_mm_reads: true
  rc_reverse: false
  count_mm_reads: true
  sort_mm_read_counts: true
